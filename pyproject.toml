[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "leroy-ci"
version = "0.1.0"
description = "Observable Python pipelines with a durable PostgreSQL control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "sqlalchemy==2.1.2",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "pydantic==2.13.5",
  "pwdlib[argon2]==0.3.1", "croniter==6.2.4", "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
leroy = "leroy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leroy = ["inventory.json", "migrated/*.sh", "migrated/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
